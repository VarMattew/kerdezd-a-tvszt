# A korpusz dokumentumlistája. A data/raw/ tartalma ebből reprodukálható:  uv run python scripts/fetch.py
#
# Mezők:
#   id        egyedi azonosító (fájlnév és chunk_id előtag)
#   title     emberi olvasásra szánt cím (a hivatkozásokban ez jelenik meg)
#   short     rövid név a hivatkozásokhoz, pl. „TVSZ”, „BSc ZV-szabályzat”
#   scope     egyetemi | VIK | szak:<név>
#   priority  P0 (kötelező) | P1 (fontos) | P2 (opcionális)
#   format    pdf | html
#   url       letöltési URL (VIK-dokumentumoknál a /document/<id>/ forma elég)
#   note      opcionális megjegyzés
#
# A letöltés eredménye (sha256, méret, dátum) a data/raw/manifest.json-ba kerül, nem ide.
#
# Kiválasztási elvek (F1, 2026-11-25):
#   - csak hallgatókra vonatkozó tanulmányi szabályok (oktatói/munkatársi dékáni utasítások,
#     bérpolitika, doktori képzés, iratkezelés stb. kimarad)
#   - mindig csak a hatályos / legfrissebb változat (a régebbi tantervekhez tartozó változatok kimaradnak)
#   - a tárgyadatlapok (portal.vik.bme.hu) automatikusan nem érhetők el (HTTP 403), lásd TERV.md

